; MeshCore on sim-mesh: the Portduino platform (MeshCore as a Linux process)
; with sim-mesh's virtual SX1262 under RadioLib, in place of a board's SPI bus.
; sim-mesh's radio/portduino library is taken from sim-mesh's clone beside
; this repository.

[portduino_base]
extends = arduino_base
platform = https://github.com/meshtastic/platform-native/archive/86c62edfb7084d11669aa255411a70580e83823b.zip
board = cross_platform
build_flags = ${arduino_base.build_flags}
  -D PORTDUINO_PLATFORM
  -D RADIOLIB_EEPROM_UNSUPPORTED
  -std=gnu++17
build_src_filter = ${arduino_base.build_src_filter}
  +<helpers/portduino/*.cpp>
extra_scripts = pre:arch/portduino/build_info.py

[sim_mesh_sx1262]
extends = portduino_base
build_flags = ${portduino_base.build_flags}
  -I variants/sim_mesh_sx1262
  -D SIM_MESH_SX1262
  -D P_LORA_NSS=1
  -D P_LORA_RESET=2
  -D P_LORA_BUSY=3
  -D P_LORA_DIO_1=4
  -D USE_SX1262
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D LORA_TX_POWER=22
  -D SX126X_DIO2_AS_RF_SWITCH=true
  -D SX126X_DIO3_TCXO_VOLTAGE=1.8
  -D SX126X_CURRENT_LIMIT=140
  -D SX126X_RX_BOOSTED_GAIN=1
build_src_filter = ${portduino_base.build_src_filter}
  +<../variants/sim_mesh_sx1262/*.cpp>
lib_deps = ${portduino_base.lib_deps}
  symlink://../sim-mesh/radio/portduino
extra_scripts = ${portduino_base.extra_scripts}
  pre:../sim-mesh/radio/portduino/casefold.py

[env:sim_mesh_sx1262_repeater]
extends = sim_mesh_sx1262
build_flags = ${sim_mesh_sx1262.build_flags}
  -I examples/simple_repeater
  -D ADVERT_NAME='"Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
build_src_filter = ${sim_mesh_sx1262.build_src_filter}
  +<../variants/sim_mesh_sx1262/console/*.cpp>
  +<../examples/simple_repeater/main.cpp>
  +<../examples/simple_repeater/MyMesh.cpp>

[env:sim_mesh_sx1262_room]
extends = sim_mesh_sx1262
build_flags = ${sim_mesh_sx1262.build_flags}
  -I examples/simple_room_server
  -D ADVERT_NAME='"Room"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D ROOM_PASSWORD='"hello"'
build_src_filter = ${sim_mesh_sx1262.build_src_filter}
  +<../variants/sim_mesh_sx1262/console/*.cpp>
  +<../examples/simple_room_server/main.cpp>
  +<../examples/simple_room_server/MyMesh.cpp>

[env:sim_mesh_sx1262_companion]
extends = sim_mesh_sx1262
build_flags = ${sim_mesh_sx1262.build_flags}
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D ENABLE_USB_INTERFACE
  -D ALLOWED_REPEAT_FREQ_RANGE='{150000,2500000}'
build_src_filter = ${sim_mesh_sx1262.build_src_filter}
  +<../examples/companion_radio/*.cpp>
lib_deps = ${sim_mesh_sx1262.lib_deps}
  densaugeo/base64 @ ~1.4.0
